name: Deploy Elibha to Cloudflare Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
  workflow_run:
    workflows:
      - Populate competition winners panels
      - Rebuild early Masherat Cup tables
      - Normalize cup bracket display scale
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=elibhafootball
      
