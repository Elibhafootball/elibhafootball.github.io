name: Complete knockout cup results archive
on:
  push:
    paths:
      - scripts/install_knockout_cup_results.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build cup results from existing knockout diagrams
        run: python scripts/install_knockout_cup_results.py
      - name: Commit all cup pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions/
          if ! git diff --cached --quiet; then
            git commit -m "Complete knockout match results throughout cup archive"
            git push
          fi
