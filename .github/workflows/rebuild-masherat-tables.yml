name: Rebuild early Masherat Cup tables
on:
  push:
    paths:
      - scripts/rebuild_masherat_tables.py
      - .github/workflows/rebuild-masherat-tables.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/rebuild_masherat_tables.py
      - name: Commit corrected standings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions/ masherat-table-rebuild-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Recalculate early Masherat Cup tables from match results"
            for attempt in 1 2 3 4 5; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:master; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
