name: Populate competition winners panels
on:
  push:
    paths:
      - scripts/populate_competition_winners.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate winners panels
        run: python scripts/populate_competition_winners.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions/ competition-winners-rollout-report.txt
          if ! git diff --cached --quiet; then
            git commit -m "Populate verified competition winners panels"
            git push
          fi
