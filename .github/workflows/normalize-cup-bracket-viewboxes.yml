name: Normalize cup bracket display scale
on:
  push:
    paths:
      - scripts/normalize_cup_bracket_viewboxes.py
      - .github/workflows/normalize-cup-bracket-viewboxes.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize SVG viewport attributes
        run: python scripts/normalize_cup_bracket_viewboxes.py
      - name: Commit corrected competition pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions/
          if ! git diff --cached --quiet; then
            git commit -m "Standardize cup bracket SVG display scale"
            for attempt in 1 2 3 4 5; do
              git fetch origin master
              git rebase origin/master
              if git push origin HEAD:master; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
