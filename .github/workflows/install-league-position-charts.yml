name: Install league position charts
on:
  push:
    paths:
      - scripts/install_league_position_charts.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add charts to league seasons
        run: python scripts/install_league_position_charts.py
      - name: Commit season pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitions/
          if ! git diff --cached --quiet; then
            git commit -m "Install league position charts across archive"
            git push
          fi
